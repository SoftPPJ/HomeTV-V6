name: HomeTV source repository (APK builds disabled)

# APK compilation and release are handled in ppj1981/HomeTV-Build.
# Keep this repository focused on source code and development checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm build ownership
        run: echo "No APK is built or published from SoftPPJ/HomeTV. Use ppj1981/HomeTV-Build."
